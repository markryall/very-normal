# A plan for very-normal: the stages from QWERTY to your own layout.
#
# Keys are three rows of ten (five per hand), top row first, written as
# "qwertyuiop asdfghjkl; zxcvbnm,./". The quote key and the outer columns
# never move. Stage 0 is where you start; each later stage only rearranges
# the keys of the stage before it.

name = "Very Normal"
# Your Oryx layout id (the part after /layouts/ in its link). The link must be public.
oryx_layout = "Xx6pM"
# What each home row key does when held, left to right: ctrl, alt, cmd or shift.
# Leave a key empty if it has no hold. `check` makes sure these survive every stage.
home_row_mods = ["", "ctrl", "alt", "cmd", "", "", "cmd", "alt", "ctrl", ""]

